name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 准备 Gradle 8.7
        run: |
          chmod +x ./gradlew || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "使用仓库自带的 gradle wrapper"
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            echo "wrapper jar 缺失，改用官方发行的 Gradle 8.7"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o /tmp/gradle.zip -d /opt
            chmod +x /opt/gradle-8.7/bin/gradle
            echo "GRADLE_CMD=/opt/gradle-8.7/bin/gradle" >> $GITHUB_ENV
          fi

      - name: 构建 Debug APK
        run: $GRADLE_CMD assembleDebug --stacktrace

      - name: 构建 Release APK
        run: $GRADLE_CMD assembleRelease --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qingfeng-files-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
