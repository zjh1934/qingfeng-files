name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: qingfeng-build
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 准备 Gradle
        run: |
          chmod +x ./gradlew || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o /tmp/gradle.zip -d /opt
            chmod +x /opt/gradle-8.7/bin/gradle
            echo "GRADLE_CMD=/opt/gradle-8.7/bin/gradle" >> $GITHUB_ENV
          fi

      - name: 构建 APK（固定签名 + 递增版本号）
        id: gradle_build
        continue-on-error: true
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "versionCode = $BUILD_NUMBER"
          # 日志同时输出到终端和文件，PIPESTATUS 拿真实退出码
          $GRADLE_CMD assembleDebug --stacktrace 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: 保存构建日志（便于外部排查）
        if: always()
        run: |
          mkdir -p logs
          [ -f build.log ] || echo "(no build.log)" > build.log
          tail -c 300000 build.log > logs/build.log
          git config user.name  "qingfeng-bot"
          git config user.email "bot@qingfeng.local"
          git add -f logs
          git diff --cached --quiet && echo "日志无变化" || git commit -m "logs: run ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:main || echo "push 日志失败，忽略"

      - name: 构建失败判定
        if: env.BUILD_EXIT != '0'
        run: |
          echo "构建失败，退出码 $BUILD_EXIT"
          exit 1

      - name: 提交 APK 回仓库
        run: |
          mkdir -p prebuilt
          cp app/build/outputs/apk/debug/app-debug.apk prebuilt/qingfeng-files-debug.apk
          ls -lh prebuilt/
          git config user.name  "qingfeng-bot"
          git config user.email "bot@qingfeng.local"
          git add -f prebuilt
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "prebuilt: v1.0.${GITHUB_RUN_NUMBER}"
            git push origin HEAD:main
          fi
