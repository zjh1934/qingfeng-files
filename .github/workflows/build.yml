name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 准备 Gradle
        run: |
          chmod +x ./gradlew || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o /tmp/gradle.zip -d /opt
            chmod +x /opt/gradle-8.7/bin/gradle
            echo "GRADLE_CMD=/opt/gradle-8.7/bin/gradle" >> $GITHUB_ENV
          fi

      - name: 构建 Debug APK
        run: $GRADLE_CMD assembleDebug --stacktrace

      - name: 构建 Release APK
        run: $GRADLE_CMD assembleRelease --stacktrace

      - name: 把 APK 直接提交回仓库（便于外部直连下载）
        run: |
          mkdir -p prebuilt
          cp app/build/outputs/apk/debug/app-debug.apk   prebuilt/qingfeng-files-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk prebuilt/qingfeng-files-release-unsigned.apk 2>/dev/null || true
          ls -lh prebuilt/
          git config user.name  "qingfeng-bot"
          git config user.email "bot@qingfeng.local"
          git add -f prebuilt
          git diff --cached --quiet && echo "无变化" || git commit -m "prebuilt: APK from run ${GITHUB_RUN_NUMBER}"
          git push origin main

      - name: 上传 artifact（备用）
        uses: actions/upload-artifact@v4
        with:
          name: qingfeng-files-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
