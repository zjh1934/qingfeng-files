name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: qingfeng-build
      cancel-in-progress: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 准备 Gradle
        run: |
          chmod +x ./gradlew || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q -o /tmp/gradle.zip -d /opt
            chmod +x /opt/gradle-8.7/bin/gradle
            echo "GRADLE_CMD=/opt/gradle-8.7/bin/gradle" >> $GITHUB_ENV
          fi

      - name: 构建 APK（固定签名 + 递增版本号）
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "versionCode = $BUILD_NUMBER"
          $GRADLE_CMD assembleDebug --stacktrace

      - name: 提交 APK 回仓库
        run: |
          mkdir -p prebuilt
          cp app/build/outputs/apk/debug/app-debug.apk prebuilt/qingfeng-files-debug.apk
          ls -lh prebuilt/
          git config user.name  "qingfeng-bot"
          git config user.email "bot@qingfeng.local"
          git add -f prebuilt
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "prebuilt: v1.0.${GITHUB_RUN_NUMBER}"
            git push origin HEAD:main
          fi
