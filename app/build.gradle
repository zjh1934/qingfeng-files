plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

def keystoreProps = [
        storeFile : rootProject.file("keystore/qingfeng.jks"),
        storePass : "qingfeng2026",
        keyAlias  : "qingfeng",
        keyPass   : "qingfeng2026"
]

def buildNumber = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.qingfeng.files'
    compileSdk 36

    defaultConfig {
        applicationId "com.qingfeng.files"
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        qingfeng {
            storeFile keystoreProps.storeFile
            storePassword keystoreProps.storePass
            keyAlias keystoreProps.keyAlias
            keyPassword keystoreProps.keyPass
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.qingfeng
        }
        release {
            signingConfig signingConfigs.qingfeng
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
